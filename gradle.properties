# Plugin metadata
pluginVersion=1.0.0

# BedWars1058 API version to compile against (resolved from https://repo.andrei1058.dev/releases/).
# Override on the command line with -PbedwarsApiVersion=<version>
bedwarsApiVersion=25.2

# Optional: compile against a local BedWars1058 jar instead of the Maven artifact
# (also works if you simply drop a jar into ./libs). Example: -PbedwarsApiJar=/path/to/BedWars1058.jar
# bedwarsApiJar=

org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
kotlin.code.style=official
